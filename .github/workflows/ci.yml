name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 不能用 20：jsdom 30 要求 ^22.22.2 || ^24.15.0 || >=26，
          # 在 Node 20 上它内嵌的 undici 会直接崩（webidl.util.markAsUncloneable
          # is not a function），四个测试文件全部报 testCodeFailure。
          # 必须钉到满足引擎要求的版本，写 "22" 解析出来的可能仍低于 22.22.2。
          node-version: "22.22.2"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 打印环境
        run: node -v && npm -v

      - name: 静态自检（语法 / manifest / 词典 / 密钥）
        run: npm run check

      - name: 单元测试
        run: npm test

      - name: 打包 .plugin
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: katakana-terminator-plugin
          path: builds/*.plugin
          if-no-files-found: error

  release:
    # 打 tag 时自动发 Release，产物可以直接丢进 BetterNCM 插件目录
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 test job 保持一致，理由见上
          node-version: "22.22.2"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 打包
        run: npm run build

      - name: 读取插件版本
        id: meta
        run: echo "version=$(node -p "require('./src/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: builds/*.plugin
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
