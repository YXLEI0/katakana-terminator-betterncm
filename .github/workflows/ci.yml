name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 静态自检（语法 / manifest / 词典 / 密钥）
        run: npm run check

      - name: 单元测试
        run: |
          # node --test 在某些受限环境里起不了子进程，退回逐个文件跑
          node --test tests/ || npm run test:serial

      - name: 打包 .plugin
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: katakana-terminator-plugin
          path: builds/*.plugin
          if-no-files-found: error

  release:
    # 打 tag 时自动发 Release，产物可以直接丢进 BetterNCM 插件目录
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 打包
        run: npm run build

      - name: 读取插件版本
        id: meta
        run: echo "version=$(node -p "require('./src/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: builds/*.plugin
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
